name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest

    # Which of these are set decides how the release is signed, and signing is
    # not cosmetic here: macOS keys the Accessibility grant to the code
    # signature, and the in-app updater replaces the bundle in place. A release
    # signed with a different identity from the one before it costs every user
    # their keyboard access, silently.
    #
    #   Developer ID     no Gatekeeper wall, notarised, stable   — best
    #   self-signed      one-time Gatekeeper wall, stable        — the floor
    #   neither          Gatekeeper wall AND access lost on every update
    #
    # They live at job level so the steps below can test them: the `secrets`
    # context cannot be read from a step's `if`, but `env` can.
    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
      DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      # From Scripts/make-release-certificate.sh. Used only when there is no
      # Developer ID.
      SELF_SIGNED_IDENTITY: ${{ secrets.SELF_SIGNED_IDENTITY }}
      SELF_SIGNED_CERTIFICATE_P12: ${{ secrets.SELF_SIGNED_CERTIFICATE_P12 }}
      SELF_SIGNED_CERTIFICATE_PASSWORD: ${{ secrets.SELF_SIGNED_CERTIFICATE_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          # build-app.sh derives the bundle's build number from the commit
          # count, which needs the full history.
          fetch-depth: 0

      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION)"
          if [ "${TAG}" != "${FILE}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${FILE})" >&2
            exit 1
          fi

      # A tagged release that is not signed with a stable identity is worse
      # than no release. The updater replaces the bundle in place, and macOS
      # keys the Accessibility grant to the code signature — so an ad-hoc
      # release takes every existing user's keyboard access away on install,
      # silently, with the switch still on in System Settings. Better to fail
      # the job than to publish that.
      - name: Refuse to publish an unsigned release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ -n "${DEVELOPER_ID_CERTIFICATE_P12}" ] || [ -n "${SELF_SIGNED_CERTIFICATE_P12}" ]; then
            echo "A signing certificate is configured."
            exit 0
          fi
          cat >&2 <<'MESSAGE'
          No signing certificate is configured, so this release would be
          ad-hoc signed — and an ad-hoc release breaks Accessibility for
          everyone who updates to it.

          Set either:
            DEVELOPER_ID_CERTIFICATE_P12 + DEVELOPER_ID_CERTIFICATE_PASSWORD
                                         + DEVELOPER_ID_APPLICATION
          or:
            SELF_SIGNED_CERTIFICATE_P12  + SELF_SIGNED_CERTIFICATE_PASSWORD
                                         + SELF_SIGNED_IDENTITY

          Scripts/make-release-certificate.sh produces the second set.
          See TECHNICAL.md section 9.1.
          MESSAGE
          exit 1

      - name: Test
        run: ./Scripts/test.sh

      # codesign can only use an identity that is actually in a keychain, and a
      # fresh runner has none. The certificate is carried as a base64 .p12
      # secret and imported into a throwaway keychain for the length of the job.
      - name: Import signing certificate
        if: env.DEVELOPER_ID_CERTIFICATE_P12 != '' || env.SELF_SIGNED_CERTIFICATE_P12 != ''
        run: |
          if [ -n "${DEVELOPER_ID_CERTIFICATE_P12}" ]; then
            PAYLOAD="${DEVELOPER_ID_CERTIFICATE_P12}"
            PASSWORD="${DEVELOPER_ID_CERTIFICATE_PASSWORD}"
            echo "Signing with the Developer ID certificate"
          else
            PAYLOAD="${SELF_SIGNED_CERTIFICATE_P12}"
            PASSWORD="${SELF_SIGNED_CERTIFICATE_PASSWORD}"
            # build-app.sh picks a Developer ID out of the environment by name
            # and otherwise falls back to looking for a *valid* local identity.
            # A self-signed certificate is never valid — nothing trusts its
            # root — so the name has to be handed over explicitly. codesign
            # signs with it regardless, which is all that is needed: the
            # signature is stable even though Gatekeeper dislikes it.
            if [ -z "${SELF_SIGNED_IDENTITY}" ]; then
              echo "SELF_SIGNED_CERTIFICATE_P12 is set but SELF_SIGNED_IDENTITY is not." >&2
              echo "It is the certificate's common name, e.g. 'MechKeys Release'." >&2
              exit 1
            fi
            echo "SIGNING_IDENTITY=${SELF_SIGNED_IDENTITY}" >> "${GITHUB_ENV}"
            echo "Signing with the self-signed release certificate"
          fi

          if [ -z "${PAYLOAD}" ] || [ -z "${PASSWORD}" ]; then
            echo "A certificate was provided without its password." >&2
            exit 1
          fi

          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT="${RUNNER_TEMP}/certificate.p12"

          echo "${PAYLOAD}" | base64 --decode > "${CERT}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"

          security import "${CERT}" -k "${KEYCHAIN}" -P "${PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign stops to ask for permission and the job
          # hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" > /dev/null

          security list-keychain -d user -s "${KEYCHAIN}" login.keychain-db
          rm -f "${CERT}"

          # Not `-v`: that lists valid identities only, and a self-signed one
          # is not valid. This prints it along with the reason, which is what
          # is worth having in the log.
          security find-identity -p codesigning "${KEYCHAIN}"

      - name: Build application
        run: ./Scripts/build-app.sh

      - name: Package disk image
        run: ./Scripts/make-dmg.sh

      - name: Remove the signing keychain
        if: >-
          always()
          && (env.DEVELOPER_ID_CERTIFICATE_P12 != ''
              || env.SELF_SIGNED_CERTIFICATE_P12 != '')
        run: security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" || true

      # A second copy under a name that never changes, so that
      #   https://github.com/theysap/MechKeys/releases/latest/download/MechKeys.dmg
      # is a permanent download link. GitHub serves that shortcut only for an
      # asset whose filename is the same in every release, which the versioned
      # image can never be. It is made before the checksums below, so the fixed
      # name gets its own line in SHA256SUMS.txt and can be verified the same
      # way. Scripts/install.sh looks its entry up by exact filename, so the
      # extra line changes nothing for it.
      - name: Add a fixed-name copy of the disk image
        run: |
          cd dist
          count="$(ls -1 *.dmg | wc -l)"
          if [ "${count}" -ne 1 ]; then
            echo "Expected exactly one .dmg in dist/, found ${count}:" >&2
            ls -1 *.dmg >&2
            exit 1
          fi
          cp "$(ls -1 *.dmg)" MechKeys.dmg

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.dmg dist/SHA256SUMS.txt \
            --title "${GITHUB_REF_NAME}" \
            --notes "See [CHANGELOG.md](CHANGELOG.md) for what changed in this release."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MechKeys-dmg
          path: dist/*.dmg
          if-no-files-found: error
