name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # MechKeys targets macOS 26, so the runner image needs an SDK at least that
    # new. Pin this to a specific image if `macos-latest` moves backwards.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcrun --show-sdk-version

      - name: Check formatting
        run: swift format lint --recursive --strict Sources Tests

      - name: Build
        run: swift build -c release

      - name: Test
        run: ./Scripts/test.sh

      # The recordings are committed, so a clone builds with no network and no
      # Python. This checks the library is complete and well-formed rather than
      # byte-reproducible: it is imported from an upstream registry, not
      # generated, so there is nothing local to regenerate it from.
      - name: Verify the sound library
        run: |
          count="$(find Resources/Sounds -name '*.wav' | wc -l | tr -d ' ')"
          [ "${count}" -eq 120 ] || { echo "expected 120 samples, found ${count}" >&2; exit 1; }
          for profile in red brown blue black yellow; do
            for category in standard space enter backspace tab modifier; do
              ls Resources/Sounds/"${profile}"/"${category}"_*.wav > /dev/null \
                || { echo "missing ${profile}/${category}" >&2; exit 1; }
            done
          done
          test -f Resources/LICENSE-sounds.txt || { echo "missing sound licence" >&2; exit 1; }
          echo "120 samples, all profiles and categories present"

      - name: Build application bundle
        run: ./Scripts/build-app.sh

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: MechKeys-app
          path: dist/MechKeys.app
          if-no-files-found: error
